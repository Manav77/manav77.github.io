# Site settings
title: Manav Batavia
full_name: Manav Batavia
author: Manav Batavia
email: mbatavia@purdue.edu
email2: manavbatavia@gmail.com
description: Manav Batavia is a Ph.D. student in mathematics at Purdue University, working in commutative algebra and algebraic geometry.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://manav77.github.io" # the base hostname & protocol for your site
include: ['_pages']
footer-links-active:
  stackoverflow: false

# Build settings
markdown: kramdown
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

# jekyll-seo-tag reads `image` from a page's front matter, never from site
# config, so set it as a default on every page. This is what Google, LinkedIn
# and Twitter use for the thumbnail.
defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/og-image.jpg

# Analytics. The code registered at https://www.goatcounter.com; stats live at
# https://manav77.goatcounter.com. Blank means no tracking script is emitted.
goatcounter_code: "manav77"

#theme
theme: jekyll-theme-minimal
